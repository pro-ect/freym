<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>freym — top AI creators (experimental)</title>
<meta name="description" content="Experimental: top AI creators across Instagram, Reddit and TikTok." />
<style>
  :root {
    --bg: #f5f4ee;
    --ink: #111110;
    --muted: #6f6d66;
    --line: #e4e2d8;
    --card: #ffffff;
    --accent: #ff4d00;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }

  header { display: flex; align-items: center; justify-content: space-between; padding: 22px 40px; gap: 16px; flex-wrap: wrap; }
  .wordmark { font-weight: 700; font-size: 19px; letter-spacing: -0.02em; }
  .wordmark span { color: var(--accent); }
  nav.top { display: flex; gap: 4px; flex-wrap: wrap; }
  nav.top a { font-size: 14px; color: var(--muted); padding: 6px 13px; border-radius: 999px; transition: color .15s ease; }
  nav.top a:hover { color: var(--ink); }
  nav.top a.active { background: var(--ink); color: var(--bg); }

  .hero { text-align: center; padding: 52px 24px 28px; }
  .hero h1 { font-size: clamp(34px, 5.5vw, 56px); font-weight: 500; letter-spacing: -0.03em; }
  .hero h1 em { font-style: normal; color: var(--accent); }
  .hero p { margin-top: 14px; font-size: 15px; color: var(--muted); max-width: 560px; margin-left: auto; margin-right: auto; }
  .tag { display: inline-block; margin-top: 14px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; }

  .tabs { display: flex; justify-content: center; padding: 14px 24px 4px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; background: var(--card); overflow: hidden; }
  .seg button { border: none; background: none; font: inherit; font-size: 14px; padding: 8px 18px; cursor: pointer; color: var(--muted); }
  .seg button.active { background: var(--ink); color: var(--bg); }

  .wrap { max-width: 1080px; margin: 24px auto 80px; padding: 0 24px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
  .creator {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px;
    display: flex; flex-direction: column; gap: 10px; transition: border-color .15s ease;
  }
  .creator:hover { border-color: #c9c6b8; }
  .top-row { display: flex; align-items: center; gap: 12px; }
  .top-row img, .ph { width: 46px; height: 46px; border-radius: 50%; object-fit: cover; background: var(--line); flex: none; }
  .who { min-width: 0; }
  .who .name { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who .nums { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .bio { font-size: 13px; color: #3d3c37; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .open { font-size: 13px; color: var(--muted); }
  .open:hover { color: var(--ink); }
  .vrf { color: var(--accent); font-size: 12px; }

  .rlist { display: flex; flex-direction: column; gap: 10px; max-width: 720px; margin: 0 auto; }
  .rauthor {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px;
    transition: border-color .15s ease;
  }
  .rauthor:hover { border-color: #c9c6b8; }
  .rhead { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .rhead .rank { font-size: 13px; color: var(--muted); width: 24px; }
  .rhead .name { font-weight: 650; font-size: 15px; }
  .rhead .score { font-size: 13px; color: var(--accent); font-weight: 600; }
  .rposts { margin-top: 8px; padding-left: 34px; display: flex; flex-direction: column; gap: 5px; }
  .rposts a { font-size: 13.5px; color: #3d3c37; line-height: 1.4; }
  .rposts a:hover { color: var(--ink); }
  .rposts .sub { color: var(--muted); font-size: 12px; }

  .notice {
    max-width: 640px; margin: 30px auto; padding: 20px 24px; text-align: center;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    font-size: 14.5px; color: var(--muted); line-height: 1.55;
  }
  footer { text-align: center; padding: 40px; font-size: 13px; color: var(--muted); }
  .loading { text-align: center; color: var(--muted); padding: 60px; }
  @media (max-width: 600px) { header { padding: 18px 20px; } .hero { padding: 38px 20px 18px; } }
</style>
</head>
<body>

<header>
  <a class="wordmark" href="/">freym<span>.</span></a>
  <nav class="top">
    <a href="/">work</a>
    <a href="/news/">news</a>
    <a href="/creators/" class="active">creators</a>
    <a href="/youtube/">youtube</a>
  </nav>
</header>

<section class="hero">
  <h1>top creators<em>.</em></h1>
  <p>AI creators surfacing across networks — Instagram bio search, Reddit's top authors of the week, TikTok's popular creators.</p>
  <span class="tag">experimental</span>
</section>

<div class="tabs"><div class="seg" id="tabs"></div></div>
<div class="wrap" id="wrap"><div class="loading">Loading creators…</div></div>

<footer>freym — an experiment. Profiles belong to their owners.</footer>

<script>
const BASE = "https://lmuksetmkzssoewkzdlm.supabase.co/functions/v1";
const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxtdWtzZXRta3pzc29ld2t6ZGxtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIyNTUwNTMsImV4cCI6MjA3NzgzMTA1M30.mvX1o1RBSDgfX5OwRu3ArxsTxQzeZ5ah6J0aR2ZwNuk";
const HDRS = { Authorization: "Bearer " + ANON_KEY };

const TABS = [["instagram", "Instagram"], ["reddit", "Reddit"], ["tiktok", "TikTok"]];
let tab = "instagram";
let MULTI = null;   // scraper-top-creators payload
let TIKTOK = null;  // scraper-tiktok-creators payload

const $ = (s) => document.querySelector(s);
const esc = (s) => (s ?? "").toString().replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = (n) => {
  n = Number(n) || 0;
  if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M";
  if (n >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, "") + "K";
  return String(n);
};

function renderTabs() {
  const el = $("#tabs");
  el.innerHTML = "";
  for (const [id, label] of TABS) {
    const b = document.createElement("button");
    b.textContent = label;
    b.className = tab === id ? "active" : "";
    b.onclick = () => { tab = id; render(); };
    el.appendChild(b);
  }
}

async function ensureData() {
  if (tab === "tiktok") {
    if (!TIKTOK) TIKTOK = await (await fetch(`${BASE}/scraper-tiktok-creators?country=GB&sortBy=engagement`, { headers: HDRS })).json().catch(() => ({ creators: [], errors: ["fetch failed"] }));
  } else if (!MULTI) {
    MULTI = await (await fetch(`${BASE}/scraper-top-creators`, { headers: HDRS })).json();
  }
}

async function render() {
  renderTabs();
  const wrap = $("#wrap");
  wrap.innerHTML = '<div class="loading">Loading…</div>';
  try { await ensureData(); } catch (e) { wrap.innerHTML = `<div class="loading">Failed to load: ${esc(String(e))}</div>`; return; }
  wrap.innerHTML = "";

  if (tab === "instagram") {
    const list = MULTI.instagram ?? [];
    if (!list.length) { wrap.innerHTML = '<div class="loading">Nothing found.</div>'; return; }
    const grid = document.createElement("div");
    grid.className = "grid";
    for (const p of list) {
      const el = document.createElement("div");
      el.className = "creator";
      el.innerHTML = `
        <div class="top-row">
          ${p.profile_pic_url ? `<img src="${esc(p.profile_pic_url)}" loading="lazy" alt="">` : '<div class="ph"></div>'}
          <div class="who">
            <div class="name">${esc(p.full_name || p.username)} ${p.is_verified ? '<span class="vrf">✓</span>' : ""}</div>
            <div class="nums">@${esc(p.username)}${p.follower_count ? ` · ${fmt(p.follower_count)} followers` : ""}</div>
          </div>
        </div>
        ${p.biography ? `<div class="bio">${esc(p.biography)}</div>` : ""}
        <a class="open" href="${esc(p.url)}" target="_blank" rel="noopener">Open on Instagram ↗</a>`;
      grid.appendChild(el);
    }
    wrap.appendChild(grid);
  }

  if (tab === "reddit") {
    const list = MULTI.reddit ?? [];
    if (!list.length) { wrap.innerHTML = '<div class="loading">Nothing found.</div>'; return; }
    const box = document.createElement("div");
    box.className = "rlist";
    list.forEach((a, i) => {
      const el = document.createElement("div");
      el.className = "rauthor";
      el.innerHTML = `
        <div class="rhead">
          <span class="rank">${i + 1}</span>
          <a class="name" href="${esc(a.profile_url)}" target="_blank" rel="noopener">u/${esc(a.author)}</a>
          <span class="score">▲ ${fmt(a.total_score)} this week</span>
        </div>
        <div class="rposts">${a.posts.map((p) => `
          <a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}
            <span class="sub">r/${esc(p.subreddit)} · ▲${fmt(p.score)}${p.num_comments != null ? ` · ${fmt(p.num_comments)} comments` : ""}</span>
          </a>`).join("")}</div>`;
      box.appendChild(el);
    });
    wrap.appendChild(box);
  }

  if (tab === "tiktok") {
    const list = TIKTOK.creators ?? [];
    if (!list.length) {
      wrap.innerHTML = `<div class="notice">TikTok's Creative Center creator API is currently down
        (the upstream provider disabled the endpoint until TikTok restores it).<br><br>
        This tab will populate automatically once it's back.</div>`;
      return;
    }
    const grid = document.createElement("div");
    grid.className = "grid";
    for (const c of list) {
      const el = document.createElement("div");
      el.className = "creator";
      el.innerHTML = `
        <div class="top-row">
          ${c.avatar_url ? `<img src="${esc(c.avatar_url)}" loading="lazy" referrerpolicy="no-referrer" alt="">` : '<div class="ph"></div>'}
          <div class="who">
            <div class="name">${esc(c.nick_name ?? "—")}</div>
            <div class="nums">${fmt(c.follower_cnt)} followers · ${fmt(c.liked_cnt)} likes</div>
          </div>
        </div>
        ${c.tt_link ? `<a class="open" href="${esc(c.tt_link)}" target="_blank" rel="noopener">Open on TikTok ↗</a>` : ""}`;
      grid.appendChild(el);
    }
    wrap.appendChild(grid);
  }
}

render();
</script>
</body>
</html>
