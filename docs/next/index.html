<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>freym — next: curated AI works with full prompts</title>
<meta name="description" content="next — a curated gallery of AI works, each with the complete prompt behind it." />
<link rel="canonical" href="https://freym.app/next/" />
<meta property="og:title" content="freym — next: curated AI works with full prompts" />
<meta property="og:description" content="next — a curated gallery of AI works, each with the complete prompt behind it." />
<meta property="og:url" content="https://freym.app/next/" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="freym" />
<style>
  :root {
    --bg: #0a0908;
    --ink: #f4f2ec;
    --muted: #9d998e;
    --faint: #6e6a61;
    --line: #26231e;
    --card: #151310;
    --accent: #ff4d00;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 22px 40px;
  }
  .wordmark { font-weight: 700; font-size: 19px; letter-spacing: -0.02em; }
  .wordmark span { color: var(--accent); }
  nav.top { display: flex; gap: 4px; flex-wrap: wrap; }
  nav.top a { font-size: 14px; color: var(--muted); padding: 6px 13px; border-radius: 999px; transition: color .15s ease; }
  nav.top a:hover { color: var(--ink); }

  .hero { text-align: center; padding: 72px 24px 36px; }
  .hero h1 {
    font-size: clamp(38px, 6vw, 68px);
    font-weight: 500; letter-spacing: -0.03em; line-height: 1.05;
    max-width: 800px; margin: 0 auto;
  }
  .hero p { margin-top: 18px; font-size: 17px; color: var(--muted); }

  /* ---- filters ---- */
  .filters {
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    padding: 18px 24px 6px; position: sticky; top: 0; z-index: 5;
    background: linear-gradient(var(--bg) 75%, transparent);
  }
  .filters-toggle {
    display: inline-flex; align-items: center; gap: 7px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 999px; padding: 7px 15px; font-size: 13px; font-weight: 500;
    cursor: pointer; transition: border-color .15s ease; font-family: inherit;
  }
  .filters-toggle:hover { border-color: var(--ink); }
  .filters-toggle .n {
    background: var(--ink); color: var(--bg); border-radius: 999px;
    font-size: 11px; font-weight: 600; padding: 1px 7px;
  }
  .pills { display: none; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .filters.open .pills { display: flex; }
  .pill {
    display: inline-flex; align-items: center; gap: 8px;
    border: 1px solid var(--line); background: var(--card);
    border-radius: 999px; padding: 8px 16px; font-size: 14px;
    cursor: pointer; transition: all .15s ease; user-select: none;
  }
  .pill:hover { border-color: var(--ink); }
  .pill.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  /* ---- threads-style feed ---- */
  .feed {
    max-width: 620px; margin: 18px auto 80px; padding: 0 16px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .post {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 18px; padding: 18px 0 10px;
  }
  .post-head {
    display: flex; align-items: center; gap: 10px; padding: 0 18px;
  }
  .avatar {
    width: 38px; height: 38px; border-radius: 50%; flex: none;
    background: #17171a; color: #fff; object-fit: cover;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; letter-spacing: -.02em;
  }
  .handle { font-weight: 700; font-size: 15px; letter-spacing: -.01em; }
  .sep-chevron { color: var(--faint); font-size: 13px; }
  .tag-model {
    display: inline-flex; align-items: center; gap: 5px;
    color: #1877f2; font-weight: 600; font-size: 15px;
  }
  .tag-model .dots { font-size: 11px; letter-spacing: -1px; }
  .when { color: var(--faint); font-size: 14px; }
  .post-head .spacer { flex: 1; }
  .more-btn {
    background: none; border: none; cursor: pointer; color: var(--muted);
    font-size: 17px; line-height: 1; padding: 4px 2px; font-family: inherit;
  }

  .post-body { padding: 12px 18px 0; }
  .post-title { font-size: 15.5px; line-height: 1.45; letter-spacing: -.01em; }
  .prompt-line {
    display: flex; align-items: center; gap: 8px;
    margin-top: 12px; font-size: 15.5px; cursor: pointer; user-select: none;
  }
  .prompt-line .count {
    background: #211f1b; color: var(--muted); border-radius: 999px;
    font-size: 12px; font-weight: 600; padding: 2px 9px;
  }
  .prompt-line .caret { color: var(--faint); font-size: 12px; transition: transform .18s ease; }
  .post.open .prompt-line .caret { transform: rotate(180deg); }

  .prompt-box {
    display: none; margin-top: 10px;
    background: #151310; border: 1px solid var(--line); border-radius: 12px;
    padding: 14px; font-size: 13.5px; line-height: 1.6; white-space: pre-wrap;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; color: #2a2a27;
  }
  .post.open .prompt-box { display: block; }
  .chips { display: none; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .post.open .chips { display: flex; }
  .chip {
    font-size: 12px; border: 1px solid var(--line); background: var(--card);
    padding: 3px 10px; border-radius: 999px; color: var(--muted);
  }

  /* carousel: images bleed off the right edge like Threads */
  .rail {
    display: flex; gap: 8px; margin-top: 14px;
    padding: 0 18px 2px; overflow-x: auto; scroll-snap-type: x mandatory;
    scrollbar-width: none;
  }
  .rail::-webkit-scrollbar { display: none; }
  .rail img {
    height: 430px; width: auto; max-width: 88%; flex: none;
    border-radius: 12px; object-fit: cover; display: block;
    background: #1d1b18; scroll-snap-align: start; cursor: zoom-in;
  }
  .rail.single img { max-width: 100%; height: auto; max-height: 560px; }

  .ai-note { padding: 10px 18px 0; font-size: 13px; font-weight: 600; color: var(--faint); }

  .actions {
    display: flex; align-items: center; gap: 4px;
    padding: 8px 12px 0;
  }
  .act {
    display: inline-flex; align-items: center; gap: 7px;
    background: none; border: none; cursor: pointer; font-family: inherit;
    color: var(--ink); font-size: 14px; padding: 8px 10px; border-radius: 999px;
    transition: background .15s ease;
  }
  .act:hover { background: #211f1b; }
  .act svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .act.copied { color: var(--accent); }

  /* lightbox */
  .overlay {
    position: fixed; inset: 0; z-index: 50; display: none;
    background: rgba(0,0,0,.7); backdrop-filter: blur(6px);
    align-items: center; justify-content: center; padding: 28px;
  }
  .overlay.open { display: flex; }
  .overlay img { max-width: 100%; max-height: 92vh; border-radius: 10px; display: block; }
  .close-x {
    position: absolute; top: 18px; right: 18px;
    background: rgba(255,255,255,.9); border: none; width: 34px; height: 34px;
    border-radius: 50%; cursor: pointer; font-size: 15px;
  }

  footer { text-align: center; padding: 40px; font-size: 13px; color: var(--muted); }
  .loading { text-align: center; color: var(--muted); padding: 60px; }

  @media (max-width: 760px) {
    .filters { position: static; background: none; }
    header { padding: 18px 20px; }
    .feed { padding: 0 10px; }
    .rail img { height: 330px; }
  }
</style>
</head>
<body>

<header>
  <a class="wordmark" href="/">freym<span>.</span></a>
  <nav class="top">
    <a href="/">work</a>
    <a href="/news/">news</a>
    <a href="/models/">models</a>
    <a href="/blog/">blog</a>
    <a href="/creators/">creators</a>
    <a href="/youtube/">youtube</a>
  </nav>
</header>

<section class="hero">
  <h1>next.</h1>
  <p>A curated gallery of AI works — every one with the complete prompt behind it.</p>
</section>

<div class="filters" id="filters"></div>
<div class="feed" id="feed"><div class="loading">Loading gallery…</div></div>

<div class="overlay" id="overlay"><button class="close-x" onclick="closeOverlay()">✕</button><img id="lightbox" src="" alt=""></div>

<footer><span id="stats"></span><br>freym — an experiment. Images belong to their creators.</footer>

<script>
const FEED_URL = "https://lmuksetmkzssoewkzdlm.supabase.co/functions/v1/scraper-feed?creator=nextunyte";
const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxtdWtzZXRta3pzc29ld2t6ZGxtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIyNTUwNTMsImV4cCI6MjA3NzgzMTA1M30.mvX1o1RBSDgfX5OwRu3ArxsTxQzeZ5ah6J0aR2ZwNuk";

let DATA = { creators: [], posts: [] };
let CREATORS = {};
let filterModel = null;
let filtersOpen = false;

const $ = (s) => document.querySelector(s);
const esc = (s) => (s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function ago(iso) {
  if (!iso) return "";
  const secs = (Date.now() - new Date(iso).getTime()) / 1000;
  if (secs < 3600) return Math.max(1, Math.round(secs / 60)) + "m";
  if (secs < 86400) return Math.round(secs / 3600) + "h";
  if (secs < 86400 * 7) return Math.round(secs / 86400) + "d";
  return new Date(iso).toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

async function load() {
  const res = await fetch(FEED_URL, { headers: { Authorization: "Bearer " + ANON_KEY } });
  DATA = await res.json();
  for (const c of DATA.creators ?? []) CREATORS[c.id] = c;
  DATA.posts = DATA.posts.filter((p) => (p.sc_images ?? []).length);
  DATA.posts.forEach((p) => p.sc_images.sort((a, b) => a.position - b.position));
  renderFilters();
  renderFeed();
  $("#stats").textContent = `${DATA.posts.length} works · full prompts`;
}

function renderFilters() {
  const el = $("#filters");
  el.innerHTML = "";
  el.classList.toggle("open", filtersOpen);

  const toggle = document.createElement("button");
  toggle.className = "filters-toggle";
  toggle.innerHTML = "Filters" + (filterModel ? ' <span class="n">1</span>' : "");
  toggle.onclick = () => { filtersOpen = !filtersOpen; renderFilters(); };
  el.appendChild(toggle);

  const pills = document.createElement("div");
  pills.className = "pills";
  el.appendChild(pills);

  const all = pill("All", filterModel === null);
  all.onclick = () => { filterModel = null; renderFilters(); renderFeed(); };
  pills.appendChild(all);

  const counts = {};
  for (const p of DATA.posts) if (p.model_name) counts[p.model_name] = (counts[p.model_name] ?? 0) + 1;
  const models = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
  for (const m of models) {
    const pl = pill(m, filterModel === m);
    pl.onclick = () => { filterModel = filterModel === m ? null : m; renderFilters(); renderFeed(); };
    pills.appendChild(pl);
  }
}

function pill(text, active) {
  const d = document.createElement("div");
  d.className = "pill" + (active ? " active" : "");
  d.textContent = text;
  return d;
}

const ICON = {
  heart: '<svg viewBox="0 0 24 24"><path d="M20.8 8.6c0 4.5-8.8 9.9-8.8 9.9s-8.8-5.4-8.8-9.9a4.6 4.6 0 0 1 8.8-1.8 4.6 4.6 0 0 1 8.8 1.8Z"/></svg>',
  copy: '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5.5 15H5a1.5 1.5 0 0 1-1.5-1.5v-9A1.5 1.5 0 0 1 5 3h9A1.5 1.5 0 0 1 15.5 4.5V5"/></svg>',
  layers: '<svg viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3.5 12.5 8.5 4.7 8.5-4.7"/></svg>',
  share: '<svg viewBox="0 0 24 24"><path d="M21 3 10.5 13.5"/><path d="M21 3l-6.8 18-3.7-7.5L3 9.8 21 3Z"/></svg>',
};

function renderFeed() {
  const feed = $("#feed");
  feed.innerHTML = "";
  const posts = DATA.posts.filter((p) => !filterModel || p.model_name === filterModel);
  if (!posts.length) { feed.innerHTML = '<div class="loading">Nothing here yet.</div>'; return; }

  for (const p of posts) {
    const c = CREATORS[p.creator_id] ?? {};
    const handle = c.handle ?? "freym";
    const imgs = p.sc_images;
    const tags = (p.style_tags ?? []).filter((t) => t !== handle);

    const el = document.createElement("article");
    el.className = "post";
    el.innerHTML = `
      <div class="post-head">
        ${c.profile_pic_url
          ? `<img class="avatar" src="${esc(c.profile_pic_url)}" referrerpolicy="no-referrer" alt="">`
          : `<div class="avatar">${esc(handle.slice(0, 2).toUpperCase())}</div>`}
        <span class="handle">${esc(handle)}</span>
        ${p.model_name
          ? `<span class="sep-chevron">›</span>
             <span class="tag-model"><span class="dots">••</span>${esc(p.model_name)}</span>`
          : ""}
        <span class="when">${esc(ago(p.taken_at))}</span>
        <span class="spacer"></span>
        ${p.url ? `<a class="more-btn" href="${esc(p.url)}" target="_blank" rel="noopener" title="Open original">•••</a>` : ""}
      </div>

      <div class="post-body">
        ${p.caption ? `<div class="post-title">${esc(p.caption)}</div>` : ""}
        ${p.prompt_text
          ? `<div class="prompt-line" data-toggle>
               <span>Prompt below</span>
               ${imgs.length > 1 ? `<span class="count">${imgs.length}</span>` : ""}
               <span class="caret">▾</span>
             </div>
             <div class="prompt-box">${esc(p.prompt_text)}</div>`
          : ""}
        ${tags.length ? `<div class="chips">${tags.map((t) => `<span class="chip">${esc(t)}</span>`).join("")}</div>` : ""}
      </div>

      <div class="rail${imgs.length === 1 ? " single" : ""}">
        ${imgs.map((im) => `<img src="${esc(im.url)}" loading="lazy" referrerpolicy="no-referrer" alt="">`).join("")}
      </div>

      <div class="ai-note">AI content</div>

      <div class="actions">
        <span class="act">${ICON.heart}${p.like_count ? p.like_count.toLocaleString() : ""}</span>
        ${imgs.length > 1 ? `<span class="act">${ICON.layers}${imgs.length}</span>` : ""}
        ${p.prompt_text ? `<button class="act" data-copy>${ICON.copy}Copy prompt</button>` : ""}
        ${p.url ? `<a class="act" href="${esc(p.url)}" target="_blank" rel="noopener">${ICON.share}</a>` : ""}
      </div>`;

    const toggle = el.querySelector("[data-toggle]");
    if (toggle) toggle.onclick = () => el.classList.toggle("open");

    const copyBtn = el.querySelector("[data-copy]");
    if (copyBtn) copyBtn.onclick = () => {
      navigator.clipboard.writeText(p.prompt_text ?? "").then(() => {
        copyBtn.classList.add("copied");
        copyBtn.innerHTML = ICON.copy + "Copied";
        setTimeout(() => {
          copyBtn.classList.remove("copied");
          copyBtn.innerHTML = ICON.copy + "Copy prompt";
        }, 1500);
      });
    };

    el.querySelectorAll(".rail img").forEach((im) => {
      im.onclick = () => {
        $("#lightbox").src = im.src;
        $("#overlay").classList.add("open");
        document.body.style.overflow = "hidden";
      };
    });

    feed.appendChild(el);
  }
}

function closeOverlay() {
  $("#overlay").classList.remove("open");
  document.body.style.overflow = "";
}
$("#overlay").addEventListener("click", (e) => { if (e.target === e.currentTarget) closeOverlay(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeOverlay(); });

load().catch((e) => { $("#feed").innerHTML = `<div class="loading">Failed to load: ${esc(String(e))}</div>`; });
</script>
</body>
</html>
