<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>freym — top TikTok creators (experimental)</title>
<meta name="description" content="Experimental: popular TikTok creators by country and follower band, via the Creative Center data." />
<style>
  :root {
    --bg: #f5f4ee;
    --ink: #111110;
    --muted: #6f6d66;
    --line: #e4e2d8;
    --card: #ffffff;
    --accent: #ff4d00;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }

  header { display: flex; align-items: center; justify-content: space-between; padding: 22px 40px; }
  .wordmark { font-weight: 700; font-size: 19px; letter-spacing: -0.02em; }
  .wordmark span { color: var(--accent); }
  .hdr-right { font-size: 14px; color: var(--muted); }

  .hero { text-align: center; padding: 56px 24px 30px; }
  .hero h1 { font-size: clamp(34px, 5.5vw, 56px); font-weight: 500; letter-spacing: -0.03em; }
  .hero h1 em { font-style: normal; color: var(--accent); }
  .hero p { margin-top: 14px; font-size: 15px; color: var(--muted); max-width: 560px; margin-left: auto; margin-right: auto; }
  .tag { display: inline-block; margin-top: 14px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; }

  .controls { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 14px 24px 4px; }
  .search {
    width: min(420px, 90vw); border: 1px solid var(--line); border-radius: 999px;
    background: var(--card); padding: 10px 18px; font: inherit; font-size: 14px; outline: none;
  }
  .search:focus { border-color: var(--ink); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; background: var(--card); overflow: hidden; }
  .seg button { border: none; background: none; font: inherit; font-size: 13px; padding: 7px 14px; cursor: pointer; color: var(--muted); }
  .seg button.active { background: var(--ink); color: var(--bg); }

  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px;
    max-width: 1180px; margin: 26px auto 80px; padding: 0 24px;
  }
  .creator {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px;
    display: flex; flex-direction: column; gap: 12px; transition: border-color .15s ease;
  }
  .creator:hover { border-color: #c9c6b8; }
  .top { display: flex; align-items: center; gap: 12px; }
  .top img { width: 46px; height: 46px; border-radius: 50%; object-fit: cover; background: var(--line); }
  .who { min-width: 0; }
  .who .name { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who .nums { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .band { margin-left: auto; flex: none; font-size: 11px; border: 1px solid var(--line); border-radius: 999px; padding: 3px 8px; color: var(--muted); }
  .vids { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .vids a { position: relative; border-radius: 8px; overflow: hidden; aspect-ratio: 9/13; background: var(--bg); border: 1px solid var(--line); }
  .vids img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .vids .v { position: absolute; bottom: 4px; left: 6px; color: #fff; font-size: 11px; font-weight: 600; text-shadow: 0 1px 4px rgba(0,0,0,.8); }
  .open { font-size: 13px; color: var(--muted); }
  .open:hover { color: var(--ink); }

  .notice {
    max-width: 640px; margin: 40px auto; padding: 20px 24px; text-align: center;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    font-size: 14.5px; color: var(--muted); line-height: 1.55;
  }
  footer { text-align: center; padding: 40px; font-size: 13px; color: var(--muted); }
  .loading { text-align: center; color: var(--muted); padding: 60px; grid-column: 1/-1; }
  @media (max-width: 600px) { header { padding: 18px 20px; } .hero { padding: 40px 20px 20px; } }
</style>
</head>
<body>

<header>
  <a class="wordmark" href="/">freym<span>.</span></a>
  <div class="hdr-right" id="stats"></div>
</header>

<section class="hero">
  <h1>top creators<em>.</em></h1>
  <p>Popular TikTok creators — UK, 10K+ followers, from TikTok's Creative Center data. Type "ai" to narrow to AI-flavored accounts.</p>
  <span class="tag">experimental</span>
</section>

<div class="controls">
  <input class="search" id="search" type="search" placeholder="Filter by name… (try: ai)" />
  <div class="row">
    <div class="seg" id="sortSeg"></div>
    <div class="seg" id="bandSeg"></div>
  </div>
</div>

<div class="grid" id="grid"><div class="loading">Loading creators…</div></div>

<footer>freym — an experiment. Data from TikTok Creative Center.</footer>

<script>
const BASE = "https://lmuksetmkzssoewkzdlm.supabase.co/functions/v1/scraper-tiktok-creators?country=GB";
const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxtdWtzZXRta3pzc29ld2t6ZGxtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIyNTUwNTMsImV4cCI6MjA3NzgzMTA1M30.mvX1o1RBSDgfX5OwRu3ArxsTxQzeZ5ah6J0aR2ZwNuk";

const SORTS = [["engagement", "Engagement"], ["follower", "Followers"], ["avg_views", "Avg views"]];
const BANDS = ["All", "10K-100K", "100K-1M", "1M-10M", "10M+"];

let DATA = { creators: [], errors: [] };
let sortBy = "engagement";
let band = "All";
let query = "";

const $ = (s) => document.querySelector(s);
const esc = (s) => (s ?? "").toString().replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = (n) => {
  n = Number(n) || 0;
  if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M";
  if (n >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, "") + "K";
  return String(n);
};

async function load() {
  $("#grid").innerHTML = '<div class="loading">Loading creators…</div>';
  try {
    const res = await fetch(`${BASE}&sortBy=${sortBy}`, { headers: { Authorization: "Bearer " + ANON_KEY } });
    DATA = await res.json();
  } catch (e) {
    DATA = { creators: [], errors: [String(e)] };
  }
  render();
}

function renderControls() {
  const s = $("#sortSeg");
  s.innerHTML = "";
  for (const [val, label] of SORTS) {
    const b = document.createElement("button");
    b.textContent = label;
    b.className = sortBy === val ? "active" : "";
    b.onclick = () => { sortBy = val; load(); };
    s.appendChild(b);
  }
  const bs = $("#bandSeg");
  bs.innerHTML = "";
  for (const bd of BANDS) {
    const b = document.createElement("button");
    b.textContent = bd;
    b.className = band === bd ? "active" : "";
    b.onclick = () => { band = bd; render(); };
    bs.appendChild(b);
  }
}

function render() {
  renderControls();
  const grid = $("#grid");
  grid.innerHTML = "";

  const list = (DATA.creators ?? []).filter((c) => {
    if (band !== "All" && c.follower_band !== band) return false;
    if (query && !(c.nick_name ?? "").toLowerCase().includes(query)) return false;
    return true;
  });

  $("#stats").textContent = list.length ? `${list.length} creators · UK · 10K+` : "";

  if (!list.length) {
    if (DATA.errors?.length && !(DATA.creators ?? []).length) {
      grid.innerHTML = `<div class="notice">TikTok's Creative Center creator API is currently down
        (upstream provider disabled the endpoint until TikTok restores it).<br><br>
        This page will populate automatically once it's back — nothing to fix on our side.</div>`;
    } else {
      grid.innerHTML = '<div class="loading">No creators match.</div>';
    }
    return;
  }

  for (const c of list) {
    const vids = (c.items ?? []).slice(0, 3).map((it) => `
      <a href="${esc(it.item_url ?? c.tt_link ?? "#")}" target="_blank" rel="noopener">
        <img src="${esc(it.cover_url ?? it.cover ?? "")}" loading="lazy" referrerpolicy="no-referrer" alt="">
        ${it.vv != null ? `<span class="v">${fmt(it.vv)} views</span>` : ""}
      </a>`).join("");
    const el = document.createElement("div");
    el.className = "creator";
    el.innerHTML = `
      <div class="top">
        <img src="${esc(c.avatar_url ?? "")}" loading="lazy" referrerpolicy="no-referrer" alt="">
        <div class="who">
          <div class="name">${esc(c.nick_name ?? "—")}</div>
          <div class="nums">${fmt(c.follower_cnt)} followers · ${fmt(c.liked_cnt)} likes</div>
        </div>
        <span class="band">${esc(c.follower_band ?? "")}</span>
      </div>
      ${vids ? `<div class="vids">${vids}</div>` : ""}
      ${c.tt_link ? `<a class="open" href="${esc(c.tt_link)}" target="_blank" rel="noopener">Open on TikTok ↗</a>` : ""}`;
    grid.appendChild(el);
  }
}

$("#search").addEventListener("input", (e) => { query = e.target.value.trim().toLowerCase(); render(); });
load();
</script>
</body>
</html>
