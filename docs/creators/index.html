<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>freym — top AI creators</title>
<meta name="description" content="A hand-picked list of AI creators worth following." />
<link rel="canonical" href="https://freym.app/creators/" />
<meta property="og:title" content="freym — top AI creators" />
<meta property="og:description" content="A hand-picked list of AI creators worth following." />
<meta property="og:url" content="https://freym.app/creators/" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="freym" />
<style>
  :root {
    --bg: #f5f4ee;
    --ink: #111110;
    --muted: #6f6d66;
    --line: #e4e2d8;
    --card: #ffffff;
    --accent: #ff4d00;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }

  header { display: flex; align-items: center; justify-content: space-between; padding: 22px 40px; gap: 16px; flex-wrap: wrap; }
  .wordmark { font-weight: 700; font-size: 19px; letter-spacing: -0.02em; }
  .wordmark span { color: var(--accent); }
  nav.top { display: flex; gap: 4px; flex-wrap: wrap; }
  nav.top a { font-size: 14px; color: var(--muted); padding: 6px 13px; border-radius: 999px; transition: color .15s ease; }
  nav.top a:hover { color: var(--ink); }
  nav.top a.active { background: var(--ink); color: var(--bg); }

  .hero { text-align: center; padding: 52px 24px 28px; }
  .hero h1 { font-size: clamp(34px, 5.5vw, 56px); font-weight: 500; letter-spacing: -0.03em; }
  .hero h1 em { font-style: normal; color: var(--accent); }
  .hero p { margin-top: 14px; font-size: 15px; color: var(--muted); max-width: 560px; margin-left: auto; margin-right: auto; }

  .wrap { max-width: 1080px; margin: 24px auto 80px; padding: 0 24px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
  .creator {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px;
    display: flex; flex-direction: column; gap: 10px; transition: border-color .15s ease;
  }
  .creator:hover { border-color: #c9c6b8; }
  .top-row { display: flex; align-items: center; gap: 12px; }
  .top-row img, .ph { width: 46px; height: 46px; border-radius: 50%; object-fit: cover; background: var(--line); flex: none; }
  .who { min-width: 0; }
  .who .name { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who .nums { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .note { font-size: 13px; color: #3d3c37; line-height: 1.45; }
  .open { font-size: 13px; color: var(--muted); }
  .open:hover { color: var(--ink); }

  .empty {
    max-width: 560px; margin: 40px auto; padding: 28px 24px; text-align: center;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    font-size: 14.5px; color: var(--muted); line-height: 1.6;
  }
  footer { text-align: center; padding: 40px; font-size: 13px; color: var(--muted); }
  @media (max-width: 600px) { header { padding: 18px 20px; } .hero { padding: 38px 20px 18px; } }
</style>
</head>
<body>

<header>
  <a class="wordmark" href="/">freym<span>.</span></a>
  <nav class="top">
    <a href="/">work</a>
    <a href="/news/">news</a>
    <a href="/models/">models</a>
    <a href="/blog/">blog</a>
    <a href="/creators/" class="active">creators</a>
    <a href="/youtube/">youtube</a>
  </nav>
</header>

<section class="hero">
  <h1>top creators<em>.</em></h1>
  <p>A hand-picked list of AI creators worth following.</p>
</section>

<div class="wrap" id="wrap"></div>

<footer>freym — an experiment. Profiles belong to their owners.</footer>

<script>
// Hand-curated list. Add entries like:
// { name: "Jane Doe", handle: "@janedoe", network: "Instagram", url: "https://…",
//   avatar: "https://…", followers: "120K", note: "Surreal AI photography" }
const CREATORS = [];

const $ = (s) => document.querySelector(s);
const esc = (s) => (s ?? "").toString().replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function render() {
  const wrap = $("#wrap");
  wrap.innerHTML = "";
  if (!CREATORS.length) {
    wrap.innerHTML = '<div class="empty">We\'re hand-picking creators for this list.<br>Coming soon.</div>';
    return;
  }
  const grid = document.createElement("div");
  grid.className = "grid";
  for (const c of CREATORS) {
    const el = document.createElement("div");
    el.className = "creator";
    el.innerHTML = `
      <div class="top-row">
        ${c.avatar ? `<img src="${esc(c.avatar)}" loading="lazy" referrerpolicy="no-referrer" alt="">` : '<div class="ph"></div>'}
        <div class="who">
          <div class="name">${esc(c.name)}</div>
          <div class="nums">${esc([c.handle, c.network, c.followers ? c.followers + " followers" : null].filter(Boolean).join(" · "))}</div>
        </div>
      </div>
      ${c.note ? `<div class="note">${esc(c.note)}</div>` : ""}
      ${c.url ? `<a class="open" href="${esc(c.url)}" target="_blank" rel="noopener">Open profile ↗</a>` : ""}`;
    grid.appendChild(el);
  }
  wrap.appendChild(grid);
}
render();
</script>
</body>
</html>
